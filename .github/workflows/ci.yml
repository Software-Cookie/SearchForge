name: SearchForge CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test, Checkstyle, 80% coverage gate
        run: ./gradlew build --no-daemon

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
          retention-days: 7

  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fail on known high-severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    name: docker-build
    needs: [build-and-test, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: docker build -t searchforge:ci .

      - name: Smoke test with Render's free-plan memory (512 MB)
        run: |
          docker run -d --name sf -p 8080:8080 -m 512m --cpus 0.5 searchforge:ci
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q UP; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS "http://localhost:8080/api/search?q=porter+stemmer" | grep -q '"totalHits"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          # metrics must not be public in production
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/prometheus)" = "404"
          docker stats --no-stream sf

      - name: Container logs
        if: always()
        run: docker logs sf || true
