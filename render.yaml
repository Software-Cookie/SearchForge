# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# One free Docker web service; the image contains the UI, the API and the index.
services:
  - type: web
    name: searchforge
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SEARCHFORGE_PROXY_HOPS
        value: "1"
      # Live web results (ADR-003). Set ONE of these in the Render dashboard; with neither,
      # the keyless open sources are used (Wikipedia, Hacker News, Openverse, Commons).
      - key: BRAVE_API_KEY
        sync: false
      - key: SEARXNG_URL
        sync: false
